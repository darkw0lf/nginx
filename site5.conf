server {
listen 80;
server_name site1.local www.site1.local;
root /var/www/site1;
index index.html index.htm;
access_log /var/log/nginx/site1_access.log;
error_log /var/log/nginx/site1_error.log;

# Ressources statiques avec cache

location = / {
}

location ^~ /static/ {
}

location ~ \.php$, {
}

location ~* \.jpg$ {
}

location / {
}

}
